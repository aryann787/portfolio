<main id="content">
  <article class="page">
    <div class="contact-wrap">
      <p class="eyebrow reveal">Contact</p>
      <h1 class="reveal" data-stagger="1">Let&rsquo;s <em class="serif">talk</em>.</h1>
      <p class="lede reveal" data-stagger="2">For commissions, collaborations, or just to say hi.</p>
      <div class="reveal" data-stagger="3">
        <a class="btn btn-primary btn-lg" href="mailto:madebyaryan@gmail.com">madebyaryan@gmail.com</a>
      </div>
      <form id="contact-form" class="contact-form reveal" data-stagger="4" novalidate>
        <input type="hidden" name="access_key" value="848eaf3f-4870-4f84-830b-10a0a1819dd4">
        <input type="hidden" name="subject" value="New inquiry from portfolio contact form">
        <input type="hidden" name="from_name" value="Portfolio contact form">
        <input type="checkbox" name="botcheck" class="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="form-row">
          <label>Your name<input type="text" name="name" required autocomplete="name" placeholder="Jane Cooper"></label>
          <label>Your email<input type="email" name="email" required autocomplete="email" placeholder="jane@studio.com"></label>
        </div>
        <label>What&rsquo;s this about?
          <select name="topic">
            <option>Commission</option>
            <option>Collaboration</option>
            <option>Just saying hi</option>
          </select>
        </label>
        <label>Message<textarea name="message" rows="5" required placeholder="Tell me about your project&hellip;"></textarea></label>
        <div class="h-captcha" data-captcha="true" data-theme="dark"></div>
        <button class="btn btn-primary" type="submit">Send message</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
      <p class="form-fallback reveal" data-stagger="5">If the form gives you any trouble, just email me directly at <a href="mailto:madebyaryan@gmail.com">madebyaryan@gmail.com</a>.</p>
    </div>
  </article>
</main>
